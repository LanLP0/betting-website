events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile        on;
    keepalive_timeout  65;

    # Basic Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Upstreams for Swarm Services
    upstream user_service {
        server user-service:8080;
    }
    upstream wallet_service {
        server wallet-service:8080;
    }
    upstream betting_service {
        server betting-service:8080;
    }
    upstream events_service {
        server events-service:8080;
    }
    upstream management_service {
        server management-service:8080;
    }
    upstream notification_service {
        server notification-service:8080;
    }
    upstream mock_service {
        server mock-service:8080;
    }
    
    # Redis for Fast Path
    upstream redis_cache {
        server redis-cache:6379;
    }

    server {
        listen       80;
        server_name  localhost;

        # Note: In production this would require proper Lua/NJS JWT stateless validation.
        # For simulation, we assume an internal endpoint or simplified validation.
        
        # --- Public Routes ---
        
        # Auth (No JWT required)
        location /api/v1/auth/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://user_service;
            proxy_set_header Host $host;
        }

        # Events Listing (No JWT required)
        location = /api/v1/events {
            proxy_pass http://events_service;
        }
        
        # Event Details (No JWT required)
        location ~ ^/api/v1/events/[^/]+$ {
            proxy_pass http://events_service;
        }

        # Nginx Fast Path -> Redis direct read
        # Simulating openresty/redis logic via basic proxy for now (would need lua-resty-redis in real prod OpenResty)
        location ~ ^/api/v1/events/([^/]+)/odds$ {
            # In a real OpenResty setup:
            # content_by_lua_block {
            #     local redis = require "resty.redis"
            #     local red = redis:new()
            #     red:connect("redis-cache", 6379)
            #     local res, err = red:get("odds:" .. ngx.var[1])
            #     ngx.say(res)
            # }
            # Fallback to events service for simple simulation if openresty isn't used
            proxy_pass http://events_service;
        }

        # --- Internal Auth Verification ---
        location = /api/v1/auth/verify {
            internal;
            proxy_pass http://user_service/api/v1/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # --- Protected Routes ---
        
        # Users
        location /api/v1/users/ {
            auth_request /api/v1/auth/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            proxy_set_header X-User-ID $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_pass http://user_service;
        }
        
        # Wallet
        location /api/v1/wallet/ {
            auth_request /api/v1/auth/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            proxy_set_header X-User-ID $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_pass http://wallet_service;
        }
        
        # Bets
        location /api/v1/bets {
            auth_request /api/v1/auth/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            proxy_set_header X-User-ID $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_pass http://betting_service;
        }

        # Management
        location /api/v1/management/ {
            auth_request /api/v1/auth/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            proxy_set_header X-User-ID $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_pass http://management_service;
        }

        # Notification (REST)
        location /api/v1/notifications/ {
            auth_request /api/v1/auth/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            proxy_set_header X-User-ID $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_pass http://notification_service;
        }

        # Notification WebSocket (requires HTTP/1.1 Upgrade)
        location /api/v1/notifications/websocket {
            auth_request /api/v1/auth/verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            proxy_set_header X-User-ID $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_pass http://notification_service;
        }

        # Mock Service
        location /mock/ {
            proxy_pass http://mock_service;
        }

        # Swagger
        location /api/swagger/ {
            proxy_pass http://management_service;
        }
    }
}
