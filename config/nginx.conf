worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$_http_referer" "$_http_user_agent" "$request_id"';
    access_log /dev/stdout;

    sendfile        on;
    keepalive_timeout  65;

    # Basic Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Upstreams for Swarm Services
    upstream user_service {
        server user-service:8080;
    }
    upstream wallet_service {
        server wallet-service:8080;
    }
    upstream betting_service {
        server betting-service:8080;
    }
    upstream events_service {
        server events-service:8080;
    }
    upstream management_service {
        server management-service:8080;
    }
    upstream notification_service {
        server notification-service:8080;
    }
    upstream mock_service {
        server mock-service:8080;
    }
    
    # Redis for Fast Path
    upstream redis_cache {
        server redis-cache:6379;
    }

    # Update Request-ID (Passthrough if exists, else generate new)
    map $http_x_request_id $x_request_id {
        default   "${request_id}";
        ~*        "${http_x_request_id}";
    }

    server {
        listen       443 ssl http2;
        listen       [::]:443 ssl http2;
        server_name  localhost;

        # Listen on UDP for QUIC+HTTP/3
        listen       443 quic reuseport;
        listen       [::]:443 quic reuseport;

        ssl_certificate     /etc/nginx/certs/betting-website.crt;
        ssl_certificate_key /etc/nginx/certs/betting-website.key;

        # Modern TLS configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000" always;

        # Enable QUIC and HTTP/3
        ssl_quic on;
        ssl_early_data on;
        add_header Alt-Svc 'h3=":$server_port"; ma=86400';

        # Note: In production this would require proper Lua/NJS JWT stateless validation.
        # For simulation, we assume an internal endpoint or simplified validation.
        
        # --- Public Routes ---
        
        # Auth (No JWT required)
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            limit_req_status 429;
            include /etc/nginx/proxy_params;
            proxy_pass http://user_service;
        }

        # Events Listing (No JWT required)
        location = /api/v1/events {
            limit_req zone=api_general burst=50 nodelay;
            limit_req_status 429;
            include /etc/nginx/proxy_params;
            proxy_pass http://events_service;
        }

        # Event Callback Webhook (HMAC-SHA256 Signed)
        location = /api/v1/events/callback {
            limit_req zone=api_general burst=50 nodelay;
            limit_req_status 429;
            include /etc/nginx/proxy_params;
            proxy_pass http://events_service;
        }

        # Event Management (Admin JWT required)
        location /api/v1/events/mgmt/ {
            limit_req zone=api_general burst=50 nodelay;
            limit_req_status 429;
            auth_request /api/v1/auth/verify;
            include /etc/nginx/auth_proxy_params;
            include /etc/nginx/proxy_params;
            proxy_pass http://events_service;
        }
        
        # Event Details (No JWT required)
        location ~ ^/api/v1/events/[^/]+$ {
            limit_req zone=api_general burst=50 nodelay;
            limit_req_status 429;
            include /etc/nginx/proxy_params;
            proxy_pass http://events_service;
        }

        # Nginx / OpenResty Fast Path -> Redis direct read
        location ~ ^/api/v1/events/([^/]+)/odds$ {
            limit_req zone=api_general burst=50 nodelay;
            limit_req_status 429;
            set $event_id $1;
            content_by_lua_block {
                local redis = require "resty.redis"
                local red = redis:new()
                red:set_timeout(1000)
                local ok, err = red:connect("redis-cache", 6379)
                if ok then
                    local res, err = red:get("odds:" .. ngx.var.event_id)
                    if res and res ~= ngx.null then
                        ngx.header["Content-Type"] = "application/json"
                        ngx.header["X-Cache-Status"] = "HIT-REDIS-FASTPATH"
                        ngx.say(res)
                        return
                    end
                end
                ngx.exec("@events_odds_fallback")
            }
        }

        location @events_odds_fallback {
            include /etc/nginx/proxy_params;
            proxy_pass http://events_service;
        }

        # --- Internal Auth Verification ---
        location = /api/v1/auth/verify {
            internal;
            proxy_pass http://user_service/api/v1/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # --- Protected Routes ---
        
        # Users
        location /api/v1/users/ {
            limit_req zone=api_general burst=50 nodelay;
            limit_req_status 429;
            auth_request /api/v1/auth/verify;
            include /etc/nginx/auth_proxy_params;
            include /etc/nginx/proxy_params;
            proxy_pass http://user_service;
        }
        
        # Wallet
        location /api/v1/wallet/ {
            limit_req zone=api_general burst=50 nodelay;
            limit_req_status 429;
            auth_request /api/v1/auth/verify;
            include /etc/nginx/auth_proxy_params;
            include /etc/nginx/proxy_params;
            proxy_pass http://wallet_service;
        }
        
        # Bets
        location /api/v1/bets {
            limit_req zone=api_general burst=50 nodelay;
            limit_req_status 429;
            auth_request /api/v1/auth/verify;
            include /etc/nginx/auth_proxy_params;
            include /etc/nginx/proxy_params;
            proxy_pass http://betting_service;
        }

        # Management
        location /api/v1/management/ {
            limit_req zone=api_general burst=50 nodelay;
            limit_req_status 429;
            auth_request /api/v1/auth/verify;
            include /etc/nginx/auth_proxy_params;
            include /etc/nginx/proxy_params;
            proxy_pass http://management_service;
        }

        # Notification (REST)
        location /api/v1/notifications/ {
            limit_req zone=api_general burst=50 nodelay;
            limit_req_status 429;
            auth_request /api/v1/auth/verify;
            include /etc/nginx/auth_proxy_params;
            include /etc/nginx/proxy_params;
            proxy_pass http://notification_service;
        }

        # Notification WebSocket (requires HTTP/1.1 Upgrade)
        location /api/v1/notifications/websocket {
            limit_req zone=api_general burst=50 nodelay;
            limit_req_status 429;
            auth_request /api/v1/auth/verify;
            include /etc/nginx/auth_proxy_params;
            include /etc/nginx/proxy_params;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_pass http://notification_service;
        }

        # Mock Service
        location /mock/ {
            limit_req zone=api_general burst=50 nodelay;
            limit_req_status 429;
            include /etc/nginx/proxy_params;
            proxy_pass http://mock_service;
        }

        # Swagger
        location /api/v1/swagger/ {
            limit_req zone=api_general burst=30 nodelay;
            limit_req_status 429;
            include /etc/nginx/proxy_params;
            proxy_pass http://management_service;
        }

        # Catch-all for undefined routes
        location /api/ {
            return 404 '{"error": "API endpoint not found"}';
            add_header Content-Type application/json;
        }
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        return 301 https://$server_name$request_uri;
    }
}

