version: "3.8"

services:
  nginx-gateway:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - betting-website-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  rabbitmq-bus:
    image: rabbitmq:3-management-alpine
    ports:
      - "15672:15672"
    volumes:
      - ./config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - betting-website-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  postgres-datastore:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: betting_platform
      POSTGRES_USER: admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - betting-website-net
    secrets:
      - db_password
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  redis-cache:
    image: redis:7-alpine
    networks:
      - betting-website-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  clickhouse-warehouse:
    image: clickhouse/clickhouse-server
    volumes:
      - chdata:/var/lib/clickhouse
    networks:
      - betting-website-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  user-service:
    image: local/user-service:latest
    environment:
      DATABASE_URL: postgres://admin:${DB_PASSWORD}@postgres-datastore:5432/betting_platform
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-bus:5672/%2f
      JWT_SECRET_FILE: /run/secrets/jwt_private_key
    networks:
      - betting-website-net
    secrets:
      - jwt_private_key
    depends_on:
      - rabbitmq-bus
      - postgres-datastore
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  wallet-service:
    image: local/wallet-service:latest
    environment:
      DATABASE_URL: postgres://admin:${DB_PASSWORD}@postgres-datastore:5432/betting_platform
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-bus:5672/%2f
    networks:
      - betting-website-net
    depends_on:
      - rabbitmq-bus
      - postgres-datastore
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  betting-service:
    image: local/betting-service:latest
    environment:
      DATABASE_URL: postgres://admin:${DB_PASSWORD}@postgres-datastore:5432/betting_platform
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-bus:5672/%2f
      REDIS_URL: redis://redis-cache:6379/
    networks:
      - betting-website-net
    depends_on:
      - rabbitmq-bus
      - postgres-datastore
      - redis-cache
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  events-service:
    image: local/events-service:latest
    environment:
      DATABASE_URL: postgres://admin:${DB_PASSWORD}@postgres-datastore:5432/betting_platform
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-bus:5672/%2f
      REDIS_URL: redis://redis-cache:6379/
    networks:
      - betting-website-net
    depends_on:
      - rabbitmq-bus
      - postgres-datastore
      - redis-cache
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  management-service:
    image: local/management-service:latest
    environment:
      CLICKHOUSE_URL: http://clickhouse-warehouse:8123/
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-bus:5672/%2f
    networks:
      - betting-website-net
    depends_on:
      - rabbitmq-bus
      - clickhouse-warehouse
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  betting-website-net:
    driver: overlay
    attachable: true

volumes:
  pgdata:
  chdata:

secrets:
  db_password:
    external: true
  jwt_private_key:
    external: true
  jwt_public_key:
    external: true
