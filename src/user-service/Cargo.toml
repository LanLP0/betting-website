[package]
name = "user-service"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
uuid = { version = "1.24", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
lapin = "4.10"
jsonwebtoken = "11.0"
argon2 = "0.5.3"
rand_core = { version = "0.6.4", features = ["getrandom"]}
backon = "1.6.0"
log = "0.4"
env_logger = "0.11"
betting-common = { path = "../betting-common" }

