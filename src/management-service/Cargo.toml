[package]
name = "management-service"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "bigdecimal"] }
clickhouse = "0.15"
uuid = { version = "1.24", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
lapin = "4.10"
utoipa = { version = "5", features = ["actix_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
futures-util = "0.3.34"
argon2 = "0.5.3"
rand_core = { version = "0.6.4", features = ["getrandom"]}
bigdecimal = "0.4.10"
backon = "1.6.0"
log = "0.4"
betting-common = { path = "../betting-common" }
env_logger = "0.11"



