[package]
name = "betting-common"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.24", features = ["v4", "serde"] }
lapin = "4.10"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "bigdecimal"] }
backon = "1.6.0"
tokio = { version = "1", features = ["full"] }
actix-web = "4"
jsonwebtoken = "11.0"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["json"] }
redis = { version = "1.6", features = ["tokio-comp"] }
bigdecimal = "0.4.10"
