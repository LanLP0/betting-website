[package]
name = "betting-service"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "bigdecimal"] }
uuid = { version = "1.24", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
lapin = "4.10"
redis = { version = "1.6", features = ["tokio-comp"] }
futures-util = "0.3.34"
bigdecimal = "0.4.10"
backon = "1.6.0"
betting-common = { path = "../betting-common" }
env_logger = "0.11"
